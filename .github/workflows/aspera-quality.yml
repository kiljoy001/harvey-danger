name: aspera-native-quality

on:
  push:
  pull_request:

jobs:
  native-quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native test toolchain
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Unit, property, sanitizer, fuzz and mutation gate
        run: ./util/quality/run.sh

  arm64-kernel-drivers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM64 kernel test toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm qemu-system-arm build-essential git
      - name: Cache plan9port
        id: plan9port
        uses: actions/cache@v4
        with:
          path: ~/.cache/plan9port
          key: ${{ runner.os }}-ubuntu-24.04-plan9port-nowsys-v2
      - name: Build plan9port
        if: steps.plan9port.outputs.cache-hit != 'true'
        run: |
          git clone --depth=1 https://github.com/9fans/plan9port "$HOME/.cache/plan9port"
          printf 'WSYSTYPE=nowsys\n' > "$HOME/.cache/plan9port/LOCAL.config"
          cd "$HOME/.cache/plan9port"
          ./INSTALL
      - name: Check out Objective-9C
        run: |
          # Pin to the release the arm64 port was built against: newer main
          # switches monocypher.h to the stdint spelling, which collides with
          # the Plan 9 u8/u32 types in the freestanding aarch64 build.
          git clone --depth=1 --branch objective-9c-v0.2.0 \
            --recurse-submodules --shallow-submodules \
            https://github.com/kiljoy001/objective-9c.git ../objective-9c
      - name: Build the Objective-9C compiler
        run: |
          export PLAN9="$HOME/.cache/plan9port"
          export PATH="$PLAN9/bin:$PATH"
          rm -rf /tmp/o9c-build
          mkdir -p /tmp/o9c-build
          cp -a ../objective-9c/o9c/grammar.d /tmp/o9c-build/
          cp ../objective-9c/o9c/o9_type.c ../objective-9c/o9c/o9_type.h \
             ../objective-9c/o9c/node.h /tmp/o9c-build/
          cd /tmp/o9c-build
          cat grammar.d/*.y > grammar.y
          yacc -d grammar.y
          9c -o y.tab.o y.tab.c
          9c -o o9_type.o o9_type.c
          9l -o "$GITHUB_WORKSPACE/../objective-9c/o9c/o9c" \
             y.tab.o o9_type.o -lbio
      - name: Build kernel and test 9ring plus VirtIO-MMIO 9P
        run: python3 util/arm64/test_virtio9p.py
