# Harvey C toolchain: everything the driver needs, discovered automatically
# from this directory (clang loads <mode>.cfg from its own InstalledDir).
-target
x86_64-unknown-linux-elf
-fuse-ld=lld
-nostdinc
-I/n/host/apex/include
-I/n/host/apex/amd64/include
-D_SUSV2_SOURCE
-D_POSIX_SOURCE
-D_LIMITS_EXTENSION
-D_GNU_SOURCE
-DHARVEY
-include
/n/host/build/libcxx/include/compat.h
-static
-no-pie
-nostdlib
-Wl,-z,max-page-size=0x200000
$/n/host/apex/amd64/lib/crt0.o
$/n/host/apex/amd64/lib/crti.o
$/n/host/apex/amd64/lib/libap.a
$/n/host/build/libc.a
$/n/host/apex/amd64/lib/crtn.o
