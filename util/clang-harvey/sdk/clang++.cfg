# Harvey C++ toolchain, as clang.cfg plus libc++.
-target
x86_64-unknown-linux-elf
-fuse-ld=lld
-nostdlibinc
-I/n/host/util/clang-harvey/target-include
-I/n/host/build/libcxx/include/c++/v1
-I/n/host/build/libcxx/include
-I/n/host/apex/include
-I/n/host/apex/amd64/include
-D_SUSV2_SOURCE
-D_POSIX_SOURCE
-D_LIMITS_EXTENSION
-D_GNU_SOURCE
-DHARVEY
-D_WCHAR_T
-include
/n/host/build/libcxx/include/compat.h
-fexceptions
-frtti
-fno-threadsafe-statics
-static
-no-pie
-nostdlib
-Wl,-z,max-page-size=0x200000
$/n/host/apex/amd64/lib/crt0.o
$/n/host/apex/amd64/lib/crti.o
$/n/host/build/libcxx/lib/libc++.a
$/n/host/build/libcxx/lib/libunwind.a
$/n/host/apex/amd64/lib/libcxxabi.a
$/n/host/apex/amd64/lib/libap.a
$/n/host/build/libc.a
$/n/host/apex/amd64/lib/crtn.o
