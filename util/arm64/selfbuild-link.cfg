# Harvey/ARM64 guest self-build: link the guest-compiled llvm-as.o
# against the prebuilt ARM64 LLVM archives and the SDK runtime.
-target aarch64-unknown-linux-elf
-nostdlib -static -no-pie -fuse-ld=lld
-T /initramfs/sdk/apex.ld -Wl,-u,_start
-Wl,-z,max-page-size=4096 -Wl,--eh-frame-hdr
/initramfs/llvm-as.o
-Wl,--start-group
/initramfs/sdk/l/lib/libLLVMAsmParser.a
/initramfs/sdk/l/lib/libLLVMBitWriter.a
/initramfs/sdk/l/lib/libLLVMCore.a
/initramfs/sdk/l/lib/libLLVMSupport.a
/initramfs/sdk/l/lib/libLLVMAnalysis.a
/initramfs/sdk/l/lib/libLLVMFrontendHLSL.a
/initramfs/sdk/l/lib/libLLVMProfileData.a
/initramfs/sdk/l/lib/libLLVMSymbolize.a
/initramfs/sdk/l/lib/libLLVMDebugInfoGSYM.a
/initramfs/sdk/l/lib/libLLVMDebugInfoPDB.a
/initramfs/sdk/l/lib/libLLVMDebugInfoCodeView.a
/initramfs/sdk/l/lib/libLLVMDebugInfoMSF.a
/initramfs/sdk/l/lib/libLLVMDebugInfoBTF.a
/initramfs/sdk/l/lib/libLLVMDebugInfoDWARF.a
/initramfs/sdk/l/lib/libLLVMObject.a
/initramfs/sdk/l/lib/libLLVMIRReader.a
/initramfs/sdk/l/lib/libLLVMBitReader.a
/initramfs/sdk/l/lib/libLLVMRemarks.a
/initramfs/sdk/l/lib/libLLVMBitstreamReader.a
/initramfs/sdk/l/lib/libLLVMMCParser.a
/initramfs/sdk/l/lib/libLLVMMC.a
/initramfs/sdk/l/lib/libLLVMTextAPI.a
/initramfs/sdk/l/lib/libLLVMDebugInfoDWARFLowLevel.a
/initramfs/sdk/l/lib/libLLVMBinaryFormat.a
/initramfs/sdk/l/lib/libLLVMTargetParser.a
/initramfs/sdk/l/lib/libLLVMDemangle.a
/initramfs/sdk/lib/libc++.a
/initramfs/sdk/lib/libunwind.a
/initramfs/sdk/lib/libap.a
/initramfs/sdk/lib/libc.a
/initramfs/sdk/lib/libbuiltins.a
-Wl,--end-group
