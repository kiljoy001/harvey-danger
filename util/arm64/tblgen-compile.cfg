# Harvey/ARM64 guest self-build: one llvm-tblgen source file.
-target aarch64-unknown-linux-elf
-nostdlibinc
-mstrict-align
-mno-outline-atomics
-fno-stack-protector
-D_SUSV2_SOURCE -D_POSIX_SOURCE -D_LIMITS_EXTENSION -D_GNU_SOURCE -DHARVEY
-I/initramfs/sdk/include
-I/initramfs/sdk/include/machine
-I/initramfs/sdk/include/target
-I/initramfs/sdk/include/c++
-I/initramfs/sdk/include/c++/v1
-I/initramfs/sdk/include/apex
-I/initramfs/sdk/include/apex/aarch64
-I/initramfs/sdk/l/include
-I/initramfs/sdk/l/include-gen
-I/initramfs/sdk/l/tg
-I/initramfs/sdk/l/tg/Basic
-I/initramfs/sdk/l/tg/Common
-DNDEBUG -DGTEST_HAS_RTTI=0 -DLLVM_BUILD_STATIC
-D__STDC_CONSTANT_MACROS -D__STDC_FORMAT_MACROS -D__STDC_LIMIT_MACROS
-D_WCHAR_T
-fno-exceptions -funwind-tables -fno-rtti -fno-threadsafe-statics
-std=c++17
-O0
-include /initramfs/sdk/include/compat.h
